<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="420" fill="#ffffff"/>
  <!-- box with label applied -->
  <rect x="60" y="120" width="260" height="200" rx="6" fill="#c9a878" stroke="#b08f60"/>
  <g>
    <rect x="96" y="160" width="190" height="112" rx="8" fill="#ffffff" stroke="#b9b4aa"/>
    <text x="191" y="184" font-size="13" font-weight="700" text-anchor="middle" fill="#2b2f33">Telescopes Canada</text>
    <text x="191" y="204" font-size="12" text-anchor="middle" fill="#2b2f33">6977641321501</text>
    <g fill="#1c1e21">
      <rect x="116" y="212" width="3" height="30"/><rect x="123" y="212" width="5" height="30"/><rect x="132" y="212" width="2" height="30"/><rect x="138" y="212" width="6" height="30"/><rect x="148" y="212" width="2" height="30"/><rect x="154" y="212" width="4" height="30"/><rect x="162" y="212" width="7" height="30"/><rect x="173" y="212" width="2" height="30"/><rect x="179" y="212" width="5" height="30"/><rect x="188" y="212" width="3" height="30"/><rect x="195" y="212" width="6" height="30"/><rect x="205" y="212" width="2" height="30"/><rect x="211" y="212" width="4" height="30"/><rect x="219" y="212" width="7" height="30"/><rect x="230" y="212" width="2" height="30"/><rect x="236" y="212" width="5" height="30"/><rect x="245" y="212" width="3" height="30"/><rect x="252" y="212" width="6" height="30"/><rect x="262" y="212" width="2" height="30"/>
    </g>
    <text x="191" y="262" font-size="12" font-weight="700" text-anchor="middle" fill="#2b2f33">BIN: B12A-3</text>
  </g>
  <!-- RFID waves from label -->
  <g stroke="#b07d00" stroke-width="3.5" fill="none" opacity="0.85">
    <path d="M 330 216 q 14 -14 0 -28" transform="translate(0 30)"/>
    <path d="M 344 224 q 24 -24 0 -48" transform="translate(0 32)"/>
    <path d="M 358 232 q 34 -34 0 -68" transform="translate(0 34)"/>
  </g>
  <!-- C72 gun aimed at label -->
  <g transform="rotate(8 520 210)">
    <rect x="440" y="140" width="150" height="220" rx="20" fill="#2b2f33"/>
    <rect x="452" y="156" width="126" height="120" rx="8" fill="#f6f7f8"/>
    <text x="515" y="192" font-size="13" fill="#29845a" font-weight="800" text-anchor="middle">TAG PAIRED ✓</text>
    <text x="515" y="216" font-size="11" fill="#4a4f55" text-anchor="middle">ZWO Nikon-T2-II</text>
    <text x="515" y="234" font-size="11" fill="#4a4f55" text-anchor="middle">sent to Scan Station</text>
    <rect x="488" y="296" width="54" height="34" rx="9" fill="#c9503c"/>
    <!-- antenna nose -->
    <path d="M 440 150 l -26 20 l 0 40 l 26 20 Z" fill="#3a3f45"/>
  </g>
  <text x="60" y="66" font-size="17" font-weight="700" fill="#2b2f33">Stick the label on the box, then read it with the C72 (trigger pull on LINK)</text>
  <text x="60" y="384" font-size="13" fill="#6d7175">Illustration for now — a warehouse photo drops in here later.</text>
