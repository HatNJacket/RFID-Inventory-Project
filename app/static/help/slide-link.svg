<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="420" fill="#ffffff"/>
  <!-- C72 gun body -->
  <g>
    <rect x="230" y="30" width="240" height="340" rx="26" fill="#2b2f33"/>
    <rect x="246" y="52" width="208" height="250" rx="8" fill="#f6f7f8"/>
    <!-- screen header -->
    <rect x="246" y="52" width="208" height="34" rx="8" fill="#1f5f8b"/>
    <text x="350" y="75" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">TC RFID Sweep</text>
    <!-- tab grid -->
    <g font-size="13" font-weight="700" text-anchor="middle">
      <rect x="256" y="98" width="60" height="34" rx="6" fill="#e4e6e9"/>
      <text x="286" y="120" fill="#4a4f55">BATCH</text>
      <rect x="320" y="98" width="60" height="34" rx="6" fill="#e4e6e9"/>
      <text x="350" y="120" fill="#4a4f55">STATION</text>
      <rect x="384" y="98" width="60" height="34" rx="6" fill="#e4e6e9"/>
      <text x="414" y="120" fill="#4a4f55">SWEEP</text>
      <rect x="256" y="140" width="60" height="34" rx="6" fill="#e4e6e9"/>
      <text x="286" y="162" fill="#4a4f55">FIND BIN</text>
      <rect x="320" y="140" width="60" height="34" rx="6" fill="#e4e6e9"/>
      <text x="350" y="162" fill="#4a4f55">LOCATE</text>
      <rect x="384" y="140" width="60" height="34" rx="6" fill="#29845a"/>
      <text x="414" y="162" fill="#ffffff">LINK</text>
    </g>
    <!-- status line on screen -->
    <rect x="258" y="192" width="184" height="96" rx="6" fill="#eef4f0"/>
    <text x="268" y="214" font-size="11" fill="#2f3b34">LINK: barcode scans and</text>
    <text x="268" y="230" font-size="11" fill="#2f3b34">trigger reads go to the</text>
    <text x="268" y="246" font-size="11" fill="#2f3b34">web terminal.</text>
    <!-- trigger -->
    <rect x="320" y="312" width="60" height="40" rx="10" fill="#c9503c"/>
    <text x="350" y="337" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">SCAN</text>
  </g>
  <!-- red arrow to LINK -->
  <g stroke="#d72c0d" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M 540 110 Q 480 120 452 150"/>
    <path d="M 452 150 l 16 -4 M 452 150 l 6 -16" />
  </g>
  <text x="548" y="102" font-size="20" font-weight="700" fill="#d72c0d">Tap LINK</text>
  <!-- footnote chip -->
  <rect x="30" y="360" width="330" height="34" rx="8" fill="#eef4f0"/>
  <text x="44" y="382" font-size="14" fill="#2f3b34">New guns open on LINK by themselves (v3.45+)</text>
</svg>
